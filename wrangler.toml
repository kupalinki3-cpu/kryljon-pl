name = "glebia"
main = "src/index.js"
# Data zgodności wpisana ręcznie; nie była sprawdzana w workerd (brak dostępu do sieci w sesji budującej).
compatibility_date = "2025-01-01"

# Pliki z public/ serwuje platforma; /api/* nie ma pasujących plików, więc trafia do Workera.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "glebia"
database_id = "f5e5d9b3-9415-41e2-9f66-53222547c70c"

# Sekret dla /api/admin/unmatched ustaw komendą: npx wrangler secret put ADMIN_TOKEN
